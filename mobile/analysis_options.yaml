include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
  language:
    strict-casts: true
    strict-raw-types: true

formatter:
  page_width: 120

linter:
  rules:
    - prefer_single_quotes
    - require_trailing_commas
    - prefer_final_locals
    - unawaited_futures
