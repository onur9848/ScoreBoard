name: Panel

on:
  push:
    branches: [main]
    paths: ['panel/**', '.github/workflows/panel.yml']
  pull_request:
    paths: ['panel/**', '.github/workflows/panel.yml']

defaults:
  run:
    working-directory: panel

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: panel/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: docker build -t scoreboard-panel .
